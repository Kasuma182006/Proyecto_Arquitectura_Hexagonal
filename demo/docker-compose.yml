services:
  # Base de Datos PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_ceiba
    environment:
      POSTGRES_DB: ceiba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kasuma182006
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ceiba"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Aplicación Spring Boot 
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springboot_ceiba
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/ceiba
      DB_USERNAME: postgres
      DB_PASSWORD: kasuma182006
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/ceiba/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Servicio exclusivo para ejecuciones de pruebas en Jenkins 
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: base

volumes:
  postgres_data: